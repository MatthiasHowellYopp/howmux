repo: "matthiashowellyopp/howmux"
label: "howmux"
poll_interval: 1m
max_retries: 3
console_logging: false
enable_copilot_review: false

# Theme selection (optional, defaults to 'default')
# Available themes: default, high-contrast, light
theme: "high-contrast"

# Session configuration
session:
  max_history_messages: 100
  max_age: 24h
  sessions_dir: ".howmux/sessions"

# Logging configuration
logging:
  default_level: "info"
  max_buffer_lines: 10000
  max_file_size_mb: 100
  log_dir: ".howmux/logs"
